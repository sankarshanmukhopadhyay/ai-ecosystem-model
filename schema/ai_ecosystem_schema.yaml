id: https://w3id.org/ai-ecosystem/schema
name: ai_ecosystem_schema
title: AI Ecosystem Metamodel Specification
description: >-
  Property-graph metamodel of the AI ecosystem. Core structure: nodes (archetypes) and typed,
  directed edges. Analytical lenses sit on top of the core and are detachable: viewpoint-relative
  VSM frames, named feedback loops, Wardley evolution stage, and optional framework tags
  (EU AI Act, NIST AI RMF). Views are the queryable entry points (each carries the question it answers).
version: "3.1.0"

prefixes:
  linkml: https://w3id.org/linkml/
  aieco: https://w3id.org/ai-ecosystem/
  skos: http://www.w3.org/2004/02/skos/core#
  prov: http://www.w3.org/ns/prov#

imports:
  - linkml:types

default_range: string
default_prefix: aieco

# ===================================================================
# CLASSES
# ===================================================================
classes:
  EcosystemModel:
    tree_root: true
    slots:
      - metadata
      - clusters
      - nodes
      - edges
      - loops
      - frames
      - views

  Metadata:
    description: "Model-level provenance and descriptive headers."
    slots:
      - title
      - version
      - schema_version
      - description
      - as_of
      - provenance_note

  Cluster:
    description: "Functional or value-chain boundary (layout and grouping only; carries no semantics)."
    slots:
      - id
      - label
      - description

  Node:
    description: >-
      Architectural archetype: an actor, institution, component, store, or commons. Forces and
      pressures (e.g. platform absorption) are modelled as edges, not nodes.
    slots:
      - id
      - label
      - sublabel
      - cluster
      - domains
      - kind
      - evolution_stage
      - jurisdictions
      - regime_types
      - eu_ai_act_roles
      - nist_functions
      - cardinality_log10_min
      - cardinality_log10_max
      - cardinality_unit
      - confidence
      - sources
      - as_of
      - properties
    slot_usage:
      cluster:
        range: Cluster
        required: true
      domains:
        range: DomainEnum
        multivalued: true
        required: true
      kind:
        range: NodeKindEnum
        required: true
      evolution_stage:
        description: >-
          Wardley evolution stage of the node's dominant offering. Apply ONLY to value-chain
          components (things that are built, bought or consumed); leave unset for authorities,
          people and adversaries. Split a node only when an inquiry needs finer stages.
        range: EvolutionStageEnum
      jurisdictions:
        range: JurisdictionEnum
        multivalued: true
      regime_types:
        description: "Only meaningful for statutory authorities that bundle several regime types."
        range: RegimeTypeEnum
        multivalued: true
      eu_ai_act_roles:
        range: EuAiActRoleEnum
        multivalued: true
      nist_functions:
        description: "Optional. Tag only organisation-level actors and controls that actually perform the function."
        range: NistRmfFunctionEnum
        multivalued: true
      cardinality_log10_min:
        range: float
        required: true
      cardinality_log10_max:
        range: float
        required: true
      cardinality_unit:
        range: CardinalityUnitEnum
        required: true
    rules:
      - description: "evolution_stage is for value-chain components only."
        preconditions:
          slot_conditions:
            kind:
              equals_string_in: [public_authority, statutory_authority, private_oversight_body, person, threat_actor]
        postconditions:
          slot_conditions:
            evolution_stage:
              value_presence: ABSENT

  Edge:
    description: "Directed relationship: money, supply, mandate, control, liability, pressure, attack, protocol call, or data."
    slots:
      - id
      - from_node
      - to_node
      - label
      - relation_kind
      - protocol_plane
      - polarity
      - affects
      - normative_status
      - delay
      - power_asymmetry
      - switching_cost
      - confidence
      - sources
    slot_usage:
      from_node:
        range: Node
        required: true
      to_node:
        range: Node
        required: true
      relation_kind:
        range: RelationKindEnum
        required: true
      polarity:
        range: PolarityEnum
        required: true
    rules:
      - description: "protocol_plane is required for protocol calls."
        preconditions:
          slot_conditions:
            relation_kind:
              equals_string: protocol_call
        postconditions:
          slot_conditions:
            protocol_plane:
              required: true
      - description: "protocol_plane must be absent for every other relation kind."
        preconditions:
          slot_conditions:
            relation_kind:
              equals_string_in:
                - commercial_flow
                - resource_supply
                - statutory_mandate
                - governance_control
                - liability_exposure
                - competitive_pressure
                - physical_constraint
                - adversarial_attack
                - impact
                - contractual_term
                - data_flow
                - algedonic_signal
        postconditions:
          slot_conditions:
            protocol_plane:
              value_presence: ABSENT
      - description: "Market-structure fields apply only to market-type relations."
        preconditions:
          slot_conditions:
            relation_kind:
              equals_string_in:
                - statutory_mandate
                - governance_control
                - liability_exposure
                - physical_constraint
                - adversarial_attack
                - impact
                - data_flow
                - algedonic_signal
        postconditions:
          slot_conditions:
            power_asymmetry:
              value_presence: ABSENT
            switching_cost:
              value_presence: ABSENT
      - description: "normative_status is required for mandates, controls and contracts."
        preconditions:
          slot_conditions:
            relation_kind:
              equals_string_in: [statutory_mandate, governance_control, contractual_term]
        postconditions:
          slot_conditions:
            normative_status:
              required: true
      - description: "normative_status is absent for all other relation kinds."
        preconditions:
          slot_conditions:
            relation_kind:
              equals_string_in:
                - commercial_flow
                - resource_supply
                - liability_exposure
                - competitive_pressure
                - physical_constraint
                - adversarial_attack
                - impact
                - protocol_call
                - data_flow
                - algedonic_signal
        postconditions:
          slot_conditions:
            normative_status:
              value_presence: ABSENT
      - description: "A signed polarity must name the state variable it acts on."
        preconditions:
          slot_conditions:
            polarity:
              equals_string_in: [positive, negative]
        postconditions:
          slot_conditions:
            affects:
              required: true
      - description: "A neutral edge acts on no state variable."
        preconditions:
          slot_conditions:
            polarity:
              equals_string: neutral
        postconditions:
          slot_conditions:
            affects:
              value_presence: ABSENT

  Loop:
    description: >-
      Named feedback loop: an ordered, contiguous cycle of edges (each edge's to_node is the next
      edge's from_node; the last returns to the first from_node). The loop type is an analyst
      judgement; a parity check on edge polarities is only a sanity test.
    slots:
      - id
      - label
      - loop_type
      - key_variable
      - loop_edges
      - description
    slot_usage:
      loop_type:
        required: true
      loop_edges:
        required: true

  VsmFrame:
    description: >-
      Viewpoint-relative Viable System Model assignment. VSM roles are relative to a system-in-focus
      at one recursion level, so they live here, not on nodes. A node may hold different roles in
      different frames. Nodes not listed are the frame's environment or its resource suppliers.
    slots:
      - id
      - label
      - description
      - system_boundary
      - viability_question
      - recursion_offset
      - roles
    slot_usage:
      recursion_offset:
        required: true
      roles:
        required: true

  VsmRole:
    description: "A node's role within one frame."
    slots:
      - node
      - role
      - rationale
    slot_usage:
      node:
        range: Node
        required: true
      role:
        required: true

  View:
    description: "Queryable lens projecting a slice of the graph, defined by the question it answers."
    slots:
      - id
      - title
      - question
      - relation_kinds
      - focus_nodes
      - frame
      - loops_shown
      - direction

  AnyObject:
    class_uri: linkml:Any
    description: >-
      Unconstrained commentary dictionary for node-specific notes. Promote a key to a typed slot as
      soon as two nodes share it and a query needs it.

# ===================================================================
# SLOTS
# ===================================================================
slots:
  id:
    identifier: true
  title: {}
  label: {}
  sublabel: {}
  version: {}
  schema_version: {}
  description: {}
  provenance_note: {}
  rationale: {}
  question:
    description: "The inquiry this view exists to answer."
  as_of:
    range: date
  from_node:
    alias: from
    range: Node
  to_node:
    alias: to
    range: Node
  cluster:
    range: Cluster
  kind:
    range: NodeKindEnum
  evolution_stage:
    range: EvolutionStageEnum
  jurisdictions:
    range: JurisdictionEnum
    multivalued: true
  regime_types:
    range: RegimeTypeEnum
    multivalued: true
  eu_ai_act_roles:
    range: EuAiActRoleEnum
    multivalued: true
  nist_functions:
    range: NistRmfFunctionEnum
    multivalued: true
  cardinality_log10_min:
    range: float
  cardinality_log10_max:
    range: float
  cardinality_unit:
    range: CardinalityUnitEnum
  confidence:
    range: ConfidenceEnum
    description: "Confidence in the node's or edge's quantitative or factual claims."
  sources:
    description: "Citations or URIs supporting the claims (prov:wasDerivedFrom)."
    multivalued: true
  relation_kind:
    range: RelationKindEnum
  protocol_plane:
    range: ProtocolPlaneEnum
  polarity:
    range: PolarityEnum
  affects:
    description: "Name of the target-side state variable the edge acts on (e.g. 'lab margin'). Required for signed polarity."
  power_asymmetry:
    range: PowerAsymmetryEnum
  switching_cost:
    range: SwitchingCostEnum
  normative_status:
    range: NormativeStatusEnum
    description: "Normative force of a mandate, control or contract."
  delay:
    range: DelayEnum
    description: "Typical lag between the source acting and the effect on the target. Record it on loop edges."
  key_variable:
    description: "The state variable a loop reinforces or stabilises."
  system_boundary:
    description: "What is inside and outside the system-in-focus."
  viability_question:
    description: "What viability means for this system-in-focus."
  loop_type:
    range: LoopTypeEnum
  loop_edges:
    range: Edge
    multivalued: true
  recursion_offset:
    range: integer
    description: "Recursion level relative to the enterprise (0 = enterprise, +1 = jurisdiction, -1 = agent internals)."
  node:
    range: Node
  role:
    range: VsmRoleEnum
  roles:
    range: VsmRole
    multivalued: true
    inlined_as_list: true
  relation_kinds:
    range: RelationKindEnum
    multivalued: true
  focus_nodes:
    range: Node
    multivalued: true
  frame:
    range: VsmFrame
  loops_shown:
    range: Loop
    multivalued: true
  direction:
    range: DirectionEnum
  metadata:
    range: Metadata
    inlined: true
  properties:
    range: AnyObject
    inlined: true
  domains:
    range: DomainEnum
    multivalued: true
  clusters:
    range: Cluster
    multivalued: true
    inlined_as_list: true
  nodes:
    range: Node
    multivalued: true
    inlined_as_list: true
  edges:
    range: Edge
    multivalued: true
    inlined_as_list: true
  loops:
    range: Loop
    multivalued: true
    inlined_as_list: true
  frames:
    range: VsmFrame
    multivalued: true
    inlined_as_list: true
  views:
    range: View
    multivalued: true
    inlined_as_list: true

# ===================================================================
# ENUMS (all values lower snake_case)
# ===================================================================
enums:
  DomainEnum:
    description: "Node-level lens. Edge domains are derived from relation_kind (see its 'domains' annotation)."
    permissible_values:
      economic: {}
      technical: {}
      governance: {}

  EvolutionStageEnum:
    permissible_values:
      genesis:
        description: "Novel, experimental, poorly understood."
      custom_built:
        description: "Bespoke, differentiated, or rare capital assets."
      product:
        description: "Standardised, commercially packaged offerings."
      commodity:
        description: "Ubiquitous utility or open commons; near-zero marginal cost."

  NodeKindEnum:
    permissible_values:
      statutory_authority:
        description: "Bodies with statutory powers: legislatures, regulators, courts, market surveillance."
      public_authority:
        description: "Non-statutory public bodies: national AI safety/security institutes, horizon-scanning units."
      private_oversight_body:
        description: "Standards bodies, certification and audit bodies."
      organisation:
        description: "Firms, markets, and internal functions (labs, clouds, insurers, capital, enterprises, governance boards)."
      person:
        description: "Natural persons or populations of them (delegators, overseers, consumers, citizens)."
      threat_actor:
        description: "Adversaries and misuse actors."
      software_service:
        description: "Models, applications, agent runtimes, observability services."
      control_component:
        description: "Deterministic gates, policy kernels, identity brokers, tool gateways."
      data_store:
        description: "Knowledge bases, audit ledgers, production systems of record."
      commons:
        description: "Open, non-proprietary shared artefacts (open-weight models)."

  VsmRoleEnum:
    permissible_values:
      s1_operations:
        description: "System 1: operational units doing the primary activity."
      s2_coordination:
        description: "System 2: oscillation damping, protocol and identity arbitration."
      s3_control:
        description: "System 3: operational control, resource bargain, accountability."
      s3_star_audit:
        description: "System 3*: sporadic, independent audit and probing."
      s4_intelligence:
        description: "System 4: environmental scanning, foresight, adaptation."
      s5_policy:
        description: "System 5: ultimate policy and identity closure."

  JurisdictionEnum:
    permissible_values:
      global: {}
      eu: {}
      us: {}
      china: {}
      uk: {}
      apac:
        description: "Asia-Pacific excluding China (Australia, Singapore, Japan, ...)."
      multi_jurisdictional: {}

  RegimeTypeEnum:
    permissible_values:
      ex_ante_statutory:
        description: "Pre-market obligations and conformity regimes (e.g. EU AI Act)."
      ex_post_liability:
        description: "Enforcement, tort and litigation after harm (e.g. US model)."
      licensing_state_directed:
        description: "Registration, filing or licensing with state-directed oversight."
      export_control:
        description: "Controls on chips, tools, weights and technology transfer."

  CardinalityUnitEnum:
    permissible_values:
      jurisdictions: {}
      entities:
        description: "Incorporated organisations, firms, labs."
      clusters:
        description: "Mega-compute data-center clusters."
      instances:
        description: "Deployed persistent application instances or gateways."
      model_families:
        description: "Distinct model families or lineages."
      invocations_per_year:
        description: "Annual ephemeral agent execution loops."
      natural_persons: {}

  ConfidenceEnum:
    permissible_values:
      high: {}
      medium: {}
      low:
        description: "Order-of-magnitude estimate or unsourced."

  EuAiActRoleEnum:
    permissible_values:
      provider_gpai: {}
      provider_system: {}
      deployer: {}
      importer: {}
      distributor: {}
      affected_subject: {}

  NistRmfFunctionEnum:
    permissible_values:
      govern: {}
      map: {}
      measure: {}
      manage: {}

  RelationKindEnum:
    description: "Each value carries a 'domains' annotation: the lens(es) it belongs to."
    permissible_values:
      commercial_flow:
        description: "Capital, fees, subscriptions, capex, wholesale token tolls."
        annotations: {domains: "economic"}
      resource_supply:
        description: "Delivery of physical or compute capacity, hardware, or training inputs."
        annotations: {domains: "economic,technical"}
      statutory_mandate:
        description: "Legal authority: compliance orders, export controls, fines."
        annotations: {domains: "governance"}
      governance_control:
        description: "Policy bounds, scope enforcement, oversight, audit, release gating."
        annotations: {domains: "governance"}
      liability_exposure:
        description: "Tort liability, harm, legal recourse and claims."
        annotations: {domains: "governance,economic"}
      competitive_pressure:
        description: "Margin compression, platform absorption, price deflation, consumer churn."
        annotations: {domains: "economic"}
      physical_constraint:
        description: "Hard physical, electrical, thermodynamic or geographic ceilings."
        annotations: {domains: "technical,economic"}
      impact:
        description: "Real-world effect of an operation on an affected party (harm, benefit). Liability and redress are separate relations."
        annotations: {domains: "governance,economic"}
      adversarial_attack:
        description: "Hostile action against a component or model (injection, poisoning, jailbreak, misuse)."
        annotations: {domains: "technical"}
      contractual_term:
        description: "ToS disclaimers, SLAs, warranty carve-outs."
        annotations: {domains: "economic,governance"}
      protocol_call:
        description: "Authenticated technical protocol interaction."
        annotations: {domains: "technical"}
      data_flow:
        description: "Telemetry, prompts, weights, evidence, audit logs, information."
        annotations: {domains: "technical"}
      algedonic_signal:
        description: "Emergency bypass alarm to the highest policy level, skipping intermediate layers."
        annotations: {domains: "governance,technical"}

  ProtocolPlaneEnum:
    permissible_values:
      a2e:
        description: "Agent-to-Enterprise identity and authorisation."
      mip:
        description: "Model Inference Protocol."
      a2t:
        description: "Agent-to-Tool context (MCP, OpenAPI)."
      a2a:
        description: "Agent-to-Agent peer protocols."

  PolarityEnum:
    permissible_values:
      positive:
        description: "More of the source tends to increase the named 'affects' variable on the target."
      negative:
        description: "More of the source tends to decrease or bound the named 'affects' variable on the target."
      neutral:
        description: "Pure transfer with no dynamic sign; 'affects' must be absent."

  LoopTypeEnum:
    permissible_values:
      reinforcing: {}
      balancing: {}

  PowerAsymmetryEnum:
    description: "Which end of the edge holds the bargaining power. Pair with switching_cost to express captivity."
    permissible_values:
      source_dominant:
        description: "The edge's source dictates terms."
      target_dominant:
        description: "The edge's target dictates terms."
      balanced: {}

  NormativeStatusEnum:
    permissible_values:
      binding:
        description: "Legal obligation or statutory power."
      contractual:
        description: "Bilateral contract, SLA or insurance condition."
      voluntary_standard:
        description: "Technical or management standard, code of practice, certification scheme."
      practice:
        description: "Internal policy or de facto industry practice."

  DelayEnum:
    permissible_values:
      immediate: {}
      months: {}
      years: {}

  SwitchingCostEnum:
    permissible_values:
      prohibitive:
        description: "Complete architectural, physical or legal refactoring."
      high:
        description: "Significant data migration, re-indexing or prompt re-tuning."
      moderate:
        description: "Standard multi-cloud or modular API adaptation."
      low:
        description: "Commoditised drop-in replacement."

  DirectionEnum:
    permissible_values:
      tb: {}
      lr: {}
      bt: {}
      rl: {}
